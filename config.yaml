# ─────────────────────────────────────────────────────────────
#  StoryVaultFiles pipeline settings
#  Change anything here, commit, and the next run uses it.
#  Passwords and keys do NOT go here — they go in GitHub "Secrets".
# ─────────────────────────────────────────────────────────────

channel:
  name: "StoryVaultFiles"
  handle: "@storyvaultfiles"
  niche: "unsolved mysteries"
  tagline: "Every case has a file. Some were never closed."
  posting_note: "New case files every day."   # spoken in the end card
  timezone: "America/Toronto"
  daily_topics_hour: 12          # 12 = 12:00 PM local time

# Where topic ideas come from (Wikipedia categories — free, factual, licensed for reuse).
research:
  categories:
    - "Unexplained disappearances"
    - "Missing person cases"
    - "Missing person cases in the United States"
    - "Unidentified decedents"
    - "Unsolved murders in the United States"
    - "Ghost ships"
    - "Missing aircraft"
    - "Undeciphered historical codes and ciphers"
    - "Mass disappearances"
    - "Unexplained phenomena"
  candidates_per_day: 14          # how many cases the AI looks at before pitching 3
  min_article_chars: 7000         # skip cases with too little documented detail
  avoid_recent_years: 12          # skip cases newer than this (respect for families)

claude:
  # Claude researches and writes when the CLAUDE_ROUTINE_URL and CLAUDE_ROUTINE_TOKEN
  # secrets are set (SETUP.md step 12). Otherwise, or if Claude is unavailable, Gemini writes.
  enabled: true
  daily_runs: 5            # routine runs your plan allows per day: Pro 5, Max 15, Team/Enterprise 25
  use_for_topics: true     # false = Gemini picks topics, saving Claude's runs for scripts and revisions
  fallback_minutes: 50     # daily topics switch to Gemini if Claude hasn't delivered by then

writing:
  # Gemini is the free backup writer.
  # Free Gemini models, tried in order. If Google renames them, the pipeline
  # automatically finds another free "flash" model.
  models: ["gemini-3.5-flash", "gemini-3.6-flash", "gemini-3.1-flash-lite", "gemini-flash-latest", "gemini-2.5-flash"]
  target_minutes: 10              # long video length (8–12 works best for mysteries)
  words_per_minute: 145
  short_seconds: 85               # Instagram Reel / YouTube Short length (70–100 s works well for story Shorts)

voice:
  # Free Microsoft neural voices. Good mystery narrators:
  #   en-US-ChristopherNeural (deep, calm)   en-US-GuyNeural (warm)
  #   en-GB-RyanNeural (British, documentary) en-US-AndrewMultilingualNeural (modern)
  name: "en-GB-RyanNeural"        # deep British documentary narrator
  rate: "-4%"
  pitch: "-2Hz"

images:
  # One AI picture per sentence (photoreal, period-accurate), made free by your Cloudflare
  # Worker's Workers AI binding — SETUP.md step 13. If pictures can't be made, the bot asks
  # you on Telegram before using real photos + stock. Set false to always use photos + stock.
  enabled: true
  model: "@cf/black-forest-labs/flux-1-schnell"   # ~170 free images/day. Sharper but ~3x the cost: "@cf/black-forest-labs/flux-2-klein-4b"
  width: 1024
  height: 1024                    # square, so one picture can be cropped for both 16:9 and 9:16
  house_style: "cinematic documentary still, photorealistic, period-accurate details, muted desaturated colour grade, soft film grain, dramatic low-key lighting, shot on 35mm film, no text, no letters, no captions, no watermark, no logo"

video:
  width: 1920
  height: 1080
  fps: 30
  seconds_per_shot: 6             # visuals change with every sentence; longer sentences get a 2nd clip after ~6 s
  music_volume: 0.32              # background music level under the voice (0–1)
  # Footage comes from Pixabay (needs a free key), then Openverse photos (no key).
  # Pexels is used too if you already have a key (new Pexels keys are paused).
  # Put your own royalty-free .mp3 files in assets/music/ to use them instead of
  # the built-in generated ambient soundtrack.

publish:
  youtube:
    privacy: "public"             # stays "private" automatically until Google approves your API audit
    category_id: "24"             # 24 = Entertainment, 27 = Education
    also_upload_short: true       # also post the Short to YouTube Shorts (great for growth)
    ai_disclosure: true           # ticks YouTube's "altered or synthetic content" box (AI voice)
  instagram:
    enabled: true
    api_version: "v23.0"
