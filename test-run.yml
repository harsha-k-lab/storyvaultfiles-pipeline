name: Test run (no accounts needed)
# Builds a sample video with placeholder voice and footage to prove the
# video engine works. Download the result from the run's "Artifacts" section.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          for f in ofl/anton/Anton-Regular.ttf ofl/bebasneue/BebasNeue-Regular.ttf ofl/specialelite/SpecialElite-Regular.ttf; do
            curl -sSfL -o "assets/fonts/$(basename $f)" "https://github.com/google/fonts/raw/main/$f" || true
          done
          pip install -q -r requirements.txt
      - name: Build sample videos
        env:
          SVF_FAKE: "1"
        run: python tests/smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: sample-videos
          path: |
            work/**/video.mp4
            work/**/short.mp4
            work/**/thumbnail.jpg
