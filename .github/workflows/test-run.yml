name: Test run (no accounts needed)
# Builds a sample video with placeholder voice and footage to prove the
# video engine works. Download the result from the run's "Artifacts" section.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install video tools and fonts
        timeout-minutes: 20
        run: bash .github/setup-tools.sh
      - name: Build sample videos
        env:
          SVF_FAKE: "1"
        run: python tests/smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: sample-videos
          path: |
            work/**/video.mp4
            work/**/short.mp4
            work/**/thumbnail.jpg
