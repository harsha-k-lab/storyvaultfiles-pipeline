name: Claude delivery
# Claude (the routine in ROUTINE.md) pushes its topics or script to a claude/… branch.
# This picks the file up, sends topics to Telegram or renders the video, then deletes the branch.
on:
  push:
    branches: ["claude/**"]

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false
  queue: max            # wait in line (up to 100) instead of dropping taps

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Collect Claude's files
        run: |
          git fetch -q --depth=1 origin "${{ github.sha }}"
          mkdir -p delivered
          git archive "${{ github.sha }}" inbox | tar -x -C delivered || echo "no inbox folder in this push"
          ls -la delivered/inbox || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install video tools and fonts
        timeout-minutes: 20
        run: bash .github/setup-tools.sh

      - name: Run pipeline
        id: run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          CLAUDE_ROUTINE_URL: ${{ secrets.CLAUDE_ROUTINE_URL }}
          CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python -m pipeline.run deliver delivered/inbox

      - name: Tell the owner if setup failed
        if: failure() && steps.run.outcome == 'skipped'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SVF_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/setup-failed.py "Claude's delivery"

      - name: Save progress
        if: always()
        run: |
          git config user.name "storyvault-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git diff --cached --quiet && exit 0
          git commit -qm "state: claude delivery"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break; git rebase --abort 2>/dev/null; sleep 5; done

      - name: Remove Claude's delivery branch
        if: success()     # on failure the branch is kept so the delivery can be retried
        run: git push -q origin --delete "${{ github.ref_name }}" || true
