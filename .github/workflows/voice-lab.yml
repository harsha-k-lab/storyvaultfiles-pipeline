name: Voice lab
on:
  push:
    branches: ["lab/**"]
permissions:
  contents: write
jobs:
  lab:
    if: "!contains(github.event.head_commit.message, 'lab results')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q -r requirements.txt faster-whisper
      - run: PYTHONPATH=. python lab/voice_lab7.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save results to this branch
        if: always()
        run: |
          git config user.name "voice-lab"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f lab_out7 && git commit -qm "lab results" && git push -q
